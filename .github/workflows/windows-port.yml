name: Windows port
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-win
          .\.venv-win\Scripts\python.exe -m pip install -r windows\requirements.txt
      - name: Test Windows collectors
        shell: pwsh
        run: ./windows/test.ps1
      - name: Smoke test desktop pet on the isolated runner
        shell: pwsh
        run: |
          $env:AGENT_METER_TEST_PET_WINDOW = '1'
          dotnet run --project windows/AccountPreferences.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop pet smoke test failed' }
      - name: Build self-contained application
        shell: pwsh
        run: ./windows/build.ps1
      - name: Smoke test packaged backend with an isolated home
        shell: pwsh
        run: |
          $env:CODEX_HOME = ''
          $env:CLAUDE_CONFIG_DIR = ''
          $env:DSH_HOME = ''
          $env:KIMI_CODE_HOME = ''
          $env:XDG_DATA_HOME = ''
          $env:OPENCODE_DB = ''
          $result = '{"command":"refresh"}' | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --history-worker --home "$env:RUNNER_TEMP/agentmeter-empty"
          if ($LASTEXITCODE -ne 0) { throw 'Backend failed' }
          $data = $result | ConvertFrom-Json
          if ($data.account.status -ne 'disabled' -or $data.history.Codex.reason -ne 'codex_sessions_not_found') { throw 'Unexpected isolated result' }
          $disabled = & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --account-only --home "$env:RUNNER_TEMP/agentmeter-empty" --disable-codex-account --disable-kimi-account --disable-claude-account | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $disabled.account.status -ne 'disabled' -or $disabled.other_accounts.'Kimi Code'.status -ne 'disabled' -or $disabled.other_accounts.'Claude Code'.status -ne 'disabled') { throw 'Account switches failed' }
          $env:MINIMAX_TOKEN_PLAN_KEY = ''
          $env:MINIMAX_REGION = 'cn'
          $enabled = & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --account-only --home "$env:RUNNER_TEMP/agentmeter-empty" --disable-codex-account --disable-kimi-account --disable-claude-account --enable-minimax-account | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $enabled.other_accounts.'MiniMax Code'.reason -ne 'minimax_credential_not_connected') { throw 'MiniMax opt-in check failed' }
          $inputJson = '{"minimax_accounts":[{"label":"synthetic","region":"cn","key":null}]}'
          $multiple = $inputJson | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --account-only --home "$env:RUNNER_TEMP/agentmeter-empty" --disable-codex-account --disable-kimi-account --disable-claude-account --enable-minimax-account --account-input | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $multiple.other_accounts.'MiniMax Code'[0].reason -ne 'minimax_vault_credential_missing') { throw 'Saved account input check failed' }
          $env:DEEPSEEK_API_KEY = 'synthetic-ambient-key-not-used'
          $deepseek = '{"key":null}' | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --deepseek-only | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $deepseek.reason -ne 'deepseek_credential_not_connected') { throw 'DeepSeek opt-in check failed' }
          $env:DEEPSEEK_API_KEY = ''
          $fixture = @'
          import json, sqlite3, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(sys.argv[1]) / 'agentmeter-activity' / '.codex'
          root.mkdir(parents=True, exist_ok=True)
          connection = sqlite3.connect(root / 'state_5.sqlite')
          connection.execute('CREATE TABLE threads(id TEXT, cwd TEXT, created_at INTEGER, updated_at INTEGER, model TEXT)')
          connection.execute('INSERT INTO threads VALUES(?,?,?,?,?)', ('synthetic-id', 'C:/synthetic-path', int(time.time())-60, int(time.time())-30, 'synthetic-model'))
          connection.commit()
          connection.close()
          sessions = root / 'sessions'
          sessions.mkdir()
          events = [ {'type':'turn_context','payload':{'model':'synthetic-model'}},
                     {'timestamp':datetime.now(timezone.utc).isoformat(),'type':'event_msg','payload':{'type':'token_count','info':{'total_token_usage':{'input_tokens':100000000,'cached_input_tokens':0,'output_tokens':0,'reasoning_output_tokens':0}}}} ]
          (sessions / 'synthetic.jsonl').write_text('\n'.join(json.dumps(event) for event in events) + '\n', encoding='utf-8')
          '@
          $fixture | ./.venv-win/Scripts/python.exe - $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Activity fixture failed' }
          $activity = '{"command":"refresh"}' | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --history-worker --home "$env:RUNNER_TEMP/agentmeter-activity" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($activity.activity.apps | Where-Object { $_.name -eq 'Codex' -and $_.sessions -eq 1 }).Count -ne 1) { throw 'Activity aggregation failed' }
          if (@($activity.local_medals.medals | Where-Object { $_.id -eq 'day_1' -and $_.earned }).Count -ne 1) { throw 'Medal projection failed' }
          $forecastFixture = @'
          import json, sys, time
          from pathlib import Path
          from tests.test_reset_forecast import NORMALIZE
          root = Path(sys.argv[1]) / 'agentmeter-forecast' / 'AgentMeter'
          root.mkdir(parents=True, exist_ok=True)
          row = NORMALIZE['willreset']()
          row.update(status='available', reason=None, provenance='https://willreset.com/api/forecast')
          (root / 'reset-forecast.json').write_text(json.dumps({'saved_at':time.time(), 'rows':[row], 'history':{}}), encoding='utf-8')
          '@
          $forecastFixture | ./.venv-win/Scripts/python.exe - $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Forecast fixture failed' }
          $savedLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = "$env:RUNNER_TEMP/agentmeter-forecast"
            $forecast = & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --forecast-only | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $forecast.cache_state -ne 'served_from_cache' -or $forecast.sources[0].name -ne 'WillReset' -or $forecast.sources[0].'24h' -ne 83) { throw 'Forecast cache projection failed' }
          } finally { $env:LOCALAPPDATA = $savedLocalAppData }
          try {
            $env:LOCALAPPDATA = "$env:RUNNER_TEMP/agentmeter-cards"
            $reset = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 3600
            $account = @{ account = @{ status = 'available'; quota = @{ status = 'available'; value = @(@{ bucket = 'codex'; window_minutes = 300; remaining_percent = 15; resets_at = @{ epoch_seconds = $reset } }) } }; other_accounts = @{} } | ConvertTo-Json -Depth 10 -Compress
            $firstCards = $account | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --cards-update | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or @($firstCards.cards | Where-Object { $_.id -eq 'q5_80' -and $_.count -eq 1 }).Count -ne 1) { throw 'Quota card drop failed' }
            $secondCards = $account | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --cards-update | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or @($secondCards.cards | Where-Object { $_.id -eq 'q5_80' -and $_.count -eq 1 }).Count -ne 1) { throw 'Quota card deduplication failed' }
          } finally { $env:LOCALAPPDATA = $savedLocalAppData }
      - name: Smoke test application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path './windows/dist/AgentMeter/AgentMeter.Windows.exe') -ArgumentList '--demo' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited during startup with code $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Render isolated demo previews
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path './windows/dist/AgentMeter/AgentMeter.Windows.exe') -ArgumentList '--render-demo', "$env:RUNNER_TEMP/agentmeter-previews" -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0 -or @(Get-ChildItem "$env:RUNNER_TEMP/agentmeter-previews/*.png").Count -ne 48) { throw 'Demo preview generation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AgentMeter-demo-previews
          path: ${{ runner.temp }}/agentmeter-previews/*.png
          if-no-files-found: error
      - name: Package portable build
        shell: pwsh
        run: ./windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentMeter-Windows-x64
          path: |
            windows/release/AgentMeter-Windows-x64.zip
            windows/release/SHA256SUMS.txt
          if-no-files-found: error
