name: Windows port
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-win
          .\.venv-win\Scripts\python.exe -m pip install -r windows\requirements.txt
      - name: Test Windows collectors
        shell: pwsh
        run: ./windows/test.ps1
      - name: Build self-contained application
        shell: pwsh
        run: ./windows/build.ps1
      - name: Smoke test packaged backend with an isolated home
        shell: pwsh
        run: |
          $env:CODEX_HOME = ''
          $env:CLAUDE_CONFIG_DIR = ''
          $env:DSH_HOME = ''
          $env:KIMI_CODE_HOME = ''
          $env:XDG_DATA_HOME = ''
          $env:OPENCODE_DB = ''
          $result = '{"command":"refresh"}' | & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --history-worker --home "$env:RUNNER_TEMP/agentmeter-empty"
          if ($LASTEXITCODE -ne 0) { throw 'Backend failed' }
          $data = $result | ConvertFrom-Json
          if ($data.account.status -ne 'disabled' -or $data.history.Codex.reason -ne 'codex_sessions_not_found') { throw 'Unexpected isolated result' }
          $disabled = & ./windows/dist/AgentMeter/backend/AgentMeterBackend.exe --account-only --home "$env:RUNNER_TEMP/agentmeter-empty" --disable-codex-account --disable-kimi-account --disable-claude-account | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $disabled.account.status -ne 'disabled' -or $disabled.other_accounts.'Kimi Code'.status -ne 'disabled' -or $disabled.other_accounts.'Claude Code'.status -ne 'disabled') { throw 'Account switches failed' }
      - name: Smoke test application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path './windows/dist/AgentMeter/AgentMeter.Windows.exe') -ArgumentList '--demo' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited during startup with code $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Package portable build
        shell: pwsh
        run: ./windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentMeter-Windows-x64
          path: |
            windows/release/AgentMeter-Windows-x64.zip
            windows/release/SHA256SUMS.txt
          if-no-files-found: error
